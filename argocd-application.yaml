apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portal-services
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sam2580123/school-portal-application-manifest.git
    targetRevision: HEAD
    path: app-manifest
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true